<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfc572"/>
      <stop offset="50%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#7d5408"/>
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfcf9"/>
      <stop offset="100%" stop-color="#f5eed3"/>
    </linearGradient>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" stroke="#ebdca7" stroke-width="8"/>

  <!-- Islamic Geometric / Book Motif -->
  <g transform="translate(106, 126)">
    <!-- Book Left Page -->
    <path d="M150 250 C100 230 40 235 10 245 L10 40 C40 30 100 25 150 45 Z" fill="#ffffff" stroke="#b8860b" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Book Right Page -->
    <path d="M150 250 C200 230 260 235 290 245 L290 40 C260 30 200 25 150 45 Z" fill="#ffffff" stroke="#b8860b" stroke-width="12" stroke-linejoin="round"/>

    <!-- Spine -->
    <line x1="150" y1="45" x2="150" y2="250" stroke="#7d5408" stroke-width="14" stroke-linecap="round"/>

    <!-- Bookmark Ribbon -->
    <path d="M150 40 L150 140 L168 120 L186 140 L186 42 Z" fill="url(#goldGradient)"/>

    <!-- Arabic Calligraphy "مُتقِن" Style Arc Lines -->
    <path d="M50 90 C80 85 110 90 125 98" stroke="#dfc572" stroke-width="6" stroke-linecap="round"/>
    <path d="M50 130 C80 125 110 130 125 138" stroke="#dfc572" stroke-width="6" stroke-linecap="round"/>
    <path d="M50 170 C80 165 110 170 125 178" stroke="#dfc572" stroke-width="6" stroke-linecap="round"/>

    <path d="M175 98 C190 90 220 85 250 90" stroke="#dfc572" stroke-width="6" stroke-linecap="round"/>
    <path d="M175 138 C190 130 220 125 250 130" stroke="#dfc572" stroke-width="6" stroke-linecap="round"/>
    <path d="M175 178 C190 170 220 165 250 170" stroke="#dfc572" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
